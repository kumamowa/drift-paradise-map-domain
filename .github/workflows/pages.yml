name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: .
      - name: Deploy the uploaded artifact by ID
        uses: actions/github-script@v7
        id: deployment
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Missing uploaded Pages artifact ID');
            const oidc = await core.getIDToken();
            core.setSecret(oidc);
            const {owner, repo} = context.repo;
            const {data: created} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifactId, pages_build_version: context.sha, oidc_token: oidc
            });
            core.setOutput('page_url', created.page_url);
            const deploymentId = String(created.id || created.status_url.split('/').pop());
            const fatal = new Set(['deployment_failed','deployment_perms_error','deployment_content_failed','deployment_cancelled','deployment_lost']);
            let lastStatus = 'pending';
            for (let i = 0; i < 120; i++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              let status;
              try {
                ({data: status} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {owner, repo, deployment_id: deploymentId}));
              } catch (error) {
                if (error.status === 429 || error.status >= 500) continue;
                throw error;
              }
              lastStatus = status.status;
              if (lastStatus === 'succeed') { core.info('Pages deployment succeeded'); return; }
              if (fatal.has(lastStatus)) throw new Error('Pages deployment failed: ' + lastStatus);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {owner, repo, deployment_id: deploymentId});
            throw new Error('Pages deployment timed out: ' + lastStatus);

